<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#06070b" />
<title>Finanças · Audaza</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#06070b;
    --surface:rgba(255,255,255,0.03);
    --surface-2:rgba(255,255,255,0.05);
    --surface-3:rgba(255,255,255,0.08);
    --ink:#f5f5f7;
    --ink-soft:rgba(245,245,247,.72);
    --ink-faint:rgba(245,245,247,.45);
    --ink-dim:rgba(245,245,247,.22);
    --rule:rgba(245,245,247,.08);
    --rule-strong:rgba(245,245,247,.14);
    --brand:#5b9eff;
    --income:#5be38a;
    --income-soft:rgba(91,227,138,.12);
    --expense:#ff7a8a;
    --expense-soft:rgba(255,122,138,.12);
    --warn:#f5c45b;
    --paid:rgba(91,227,138,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overscroll-behavior-y:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button,a,input,select{font-family:inherit;color:inherit}
  a{text-decoration:none}
  button{cursor:pointer;border:0;background:none}
  input,select{outline:none;border:0;background:transparent}

  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(50% 50% at 85% -5%, rgba(91,158,255,.10), transparent 60%),
      radial-gradient(40% 40% at -5% 100%, rgba(91,227,138,.06), transparent 60%);
  }

  .shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 24px 96px}

  /* Header */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin-bottom:28px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,#5be38a,#5b9eff);
    display:grid;place-items:center;font-weight:700;color:#06070b;font-size:15px;
    font-family:'Space Grotesk',sans-serif;
  }
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.01em;font-size:15px}
  .brand-sub{color:var(--ink-faint);font-size:12px;margin-top:1px}
  .top-right{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;background:var(--surface);
    border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink-soft);
    transition:all .15s ease;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}

  /* Month nav + summary */
  .month-card{
    background:var(--surface);border:1px solid var(--rule);
    border-radius:20px;padding:24px;margin-bottom:20px;
    backdrop-filter:blur(8px);
  }
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
  }
  .month-title{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;
    text-transform:capitalize;letter-spacing:-.01em;
  }
  .month-arrow{
    width:34px;height:34px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink-soft);
    transition:all .15s ease;
  }
  .month-arrow:hover{background:var(--surface-3);color:var(--ink)}
  .month-today{
    font-size:12px;color:var(--ink-faint);padding:6px 10px;border-radius:8px;
    border:1px solid var(--rule);transition:all .15s ease;
  }
  .month-today:hover{color:var(--ink);border-color:var(--rule-strong)}
  .month-today.hidden{visibility:hidden}

  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  }
  .sum-cell{
    background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;
  }
  .sum-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:500}
  .sum-value{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.02em}
  .sum-sub{font-size:11px;color:var(--ink-faint);margin-top:4px}
  .sum-cell.income .sum-value{color:var(--income)}
  .sum-cell.expense .sum-value{color:var(--expense)}
  .sum-cell.balance.positive .sum-value{color:var(--income)}
  .sum-cell.balance.negative .sum-value{color:var(--expense)}

  /* Progress bar */
  .progress-wrap{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--rule);
  }
  .progress-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin-bottom:8px}
  .progress-bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;display:flex}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--income),#7ec8ff);transition:width .3s ease}

  /* Columns */
  .columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:80px}
  @media (max-width:760px){
    .columns{grid-template-columns:1fr}
    .summary{grid-template-columns:1fr 1fr}
    .sum-cell.balance{grid-column:span 2}
    .shell{padding:20px 16px 96px}
  }

  .col{
    background:var(--surface);border:1px solid var(--rule);border-radius:20px;
    padding:18px;backdrop-filter:blur(8px);
  }
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 6px}
  .col-title{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
  .col-title .dot{width:8px;height:8px;border-radius:99px}
  .col.income .dot{background:var(--income)}
  .col.expense .dot{background:var(--expense)}
  .col-total{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
  .col.income .col-total{color:var(--income)}
  .col.expense .col-total{color:var(--expense)}

  .item-list{display:flex;flex-direction:column;gap:6px}
  .item{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:transparent;border:1px solid transparent;transition:all .15s ease;
    cursor:pointer;
  }
  .item:hover{background:var(--surface-2);border-color:var(--rule)}
  .item.paid{opacity:.55}
  .item.paid .item-name{text-decoration:line-through}

  .check{
    width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-dim);
    display:grid;place-items:center;flex-shrink:0;transition:all .15s ease;
    background:transparent;
  }
  .check svg{opacity:0;transition:opacity .15s ease}
  .item.paid .check{background:var(--income);border-color:var(--income)}
  .item.paid .check svg{opacity:1}
  .col.expense .item.paid .check{background:var(--expense);border-color:var(--expense)}

  .item-body{flex:1;min-width:0}
  .item-name{font-size:14px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;display:flex;align-items:center;gap:8px}
  .item-day{display:inline-flex;align-items:center;gap:4px}
  .item-overdue{color:var(--expense);font-weight:500}
  .item-amount{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;flex-shrink:0;letter-spacing:-.01em}
  .col.income .item-amount{color:var(--income)}
  .col.expense .item-amount{color:var(--expense)}

  .empty{
    text-align:center;padding:32px 16px;color:var(--ink-faint);font-size:13px;
    border:1px dashed var(--rule);border-radius:12px;
  }
  .add-btn{
    width:100%;margin-top:10px;padding:11px;border-radius:11px;
    background:var(--surface-2);border:1px dashed var(--rule-strong);
    color:var(--ink-soft);font-size:13px;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all .15s ease;
  }
  .add-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--ink-dim);border-style:solid}

  /* Modal */
  .modal-bg{
    position:fixed;inset:0;z-index:50;background:rgba(6,7,11,.7);backdrop-filter:blur(8px);
    display:none;align-items:flex-end;justify-content:center;
    animation:fadein .2s ease;
  }
  .modal-bg.open{display:flex}
  @media (min-width:600px){.modal-bg{align-items:center}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:440px;background:#0d0e14;border:1px solid var(--rule);
    border-radius:20px 20px 0 0;padding:24px;max-height:92vh;overflow-y:auto;
    animation:slideup .25s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width:600px){.modal{border-radius:20px}}
  @keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px}
  .modal-close{width:32px;height:32px;border-radius:8px;color:var(--ink-faint)}
  .modal-close:hover{color:var(--ink);background:var(--surface-2)}

  .type-toggle{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);
    padding:4px;border-radius:11px;margin-bottom:18px;border:1px solid var(--rule);
  }
  .type-toggle button{
    padding:10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-faint);
    transition:all .15s ease;
  }
  .type-toggle button.active.income-mode{background:var(--income-soft);color:var(--income)}
  .type-toggle button.active.expense-mode{background:var(--expense-soft);color:var(--expense)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:6px;font-weight:500}
  .field input,.field select{
    width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid var(--rule);
    border-radius:11px;font-size:14px;transition:border-color .15s ease;
  }
  .field input:focus,.field select:focus{border-color:var(--rule-strong);background:var(--surface-3)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .amount-input{position:relative}
  .amount-input::before{
    content:'R$';position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--ink-faint);font-size:13px;pointer-events:none;
  }
  .amount-input input{padding-left:40px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px}

  .modal-actions{display:flex;gap:8px;margin-top:22px}
  .btn{
    padding:12px 18px;border-radius:11px;font-size:14px;font-weight:500;
    transition:all .15s ease;flex:1;
  }
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:#fff}
  .btn-ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--rule)}
  .btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
  .btn-danger{background:transparent;color:var(--expense);border:1px solid rgba(255,122,138,.3);flex:0}
  .btn-danger:hover{background:rgba(255,122,138,.08)}

  /* FAB */
  .fab{
    position:fixed;right:24px;bottom:24px;z-index:30;
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#5be38a,#5b9eff);
    color:#06070b;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(91,158,255,.3),0 2px 6px rgba(0,0,0,.4);
    transition:transform .15s ease;
  }
  .fab:hover{transform:scale(1.05)}
  .fab:active{transform:scale(.95)}

  /* Menu / Settings */
  .menu{
    position:absolute;top:50px;right:24px;background:#0d0e14;border:1px solid var(--rule);
    border-radius:14px;padding:6px;min-width:200px;z-index:40;display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .menu.open{display:block}
  .menu button{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;
    font-size:13px;color:var(--ink-soft);text-align:left;transition:all .15s ease;
  }
  .menu button:hover{background:var(--surface-2);color:var(--ink)}
  .menu button.danger:hover{background:rgba(255,122,138,.08);color:var(--expense)}
  .menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}

  /* Toast */
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#0d0e14;border:1px solid var(--rule);border-radius:12px;
    padding:12px 18px;font-size:13px;z-index:60;opacity:0;transition:all .25s ease;
    pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Categories chips in modal */
  .cat-list{display:flex;flex-wrap:wrap;gap:6px}
  .cat-chip{
    padding:7px 11px;border-radius:99px;font-size:12px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-soft);
    transition:all .15s ease;
  }
  .cat-chip:hover{background:var(--surface-3)}
  .cat-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grain"></div>

<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div>
        <div class="brand-name">Finanças</div>
        <div class="brand-sub">Receitas e despesas recorrentes</div>
      </div>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="btnMenu" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <div class="menu" id="menu">
    <button id="mExport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Exportar dados (JSON)</button>
    <button id="mImport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Importar dados (JSON)</button>
    <hr/>
    <button class="danger" id="mReset"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Limpar tudo</button>
  </div>
  <input type="file" id="fileImport" accept="application/json" style="display:none"/>

  <section class="month-card">
    <div class="month-nav">
      <button class="month-arrow" id="prevMonth" aria-label="Mês anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="text-align:center;flex:1">
        <div class="month-title" id="monthTitle">—</div>
        <button class="month-today" id="goToday">ir para hoje</button>
      </div>
      <button class="month-arrow" id="nextMonth" aria-label="Próximo mês">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="summary">
      <div class="sum-cell income">
        <div class="sum-label">Receitas</div>
        <div class="sum-value" id="sumIncome">R$ 0</div>
        <div class="sum-sub" id="subIncome">0 recebidas</div>
      </div>
      <div class="sum-cell expense">
        <div class="sum-label">Despesas</div>
        <div class="sum-value" id="sumExpense">R$ 0</div>
        <div class="sum-sub" id="subExpense">0 pagas</div>
      </div>
      <div class="sum-cell balance">
        <div class="sum-label">Saldo</div>
        <div class="sum-value" id="sumBalance">R$ 0</div>
        <div class="sum-sub" id="subBalance">previsto</div>
      </div>
    </div>

    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-head">
        <span id="progressLabel">Pagamentos do mês</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </section>

  <section class="columns">
    <div class="col income">
      <div class="col-head">
        <div class="col-title"><span class="dot"></span>Receitas</div>
        <div class="col-total" id="incomeTotal">R$ 0</div>
      </div>
      <div class="item-list" id="incomeList"></div>
      <button class="add-btn" data-add="income">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar receita
      </button>
    </div>
    <div class="col expense">
      <div class="col-head">
        <div class="col-title"><span class="dot"></span>Despesas</div>
        <div class="col-total" id="expenseTotal">R$ 0</div>
      </div>
      <div class="item-list" id="expenseList"></div>
      <button class="add-btn" data-add="expense">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar despesa
      </button>
    </div>
  </section>
</div>

<button class="fab" id="fab" aria-label="Adicionar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Novo lançamento</div>
      <button class="modal-close" id="modalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="type-toggle">
      <button id="typeIncome" class="income-mode">Receita</button>
      <button id="typeExpense" class="expense-mode">Despesa</button>
    </div>

    <div class="field">
      <label>Descrição</label>
      <input type="text" id="fName" placeholder="Ex.: Salário, Aluguel, Netflix" autocomplete="off"/>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Valor</label>
        <div class="amount-input"><input type="text" id="fAmount" inputmode="decimal" placeholder="0,00"/></div>
      </div>
      <div class="field">
        <label>Dia do mês</label>
        <select id="fDay"></select>
      </div>
    </div>

    <div class="field">
      <label>Categoria</label>
      <div class="cat-list" id="catList"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" id="btnDelete" style="display:none" aria-label="Excluir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
      <button class="btn btn-primary" id="btnSave">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Storage
============================================================ */
const STORAGE_KEY = 'audaza.financas.v1';
const DEFAULT_DATA = { version: 1, items: [], status: {} };

const CATEGORIES = {
  income: [
    { id:'salary',   name:'Salário' },
    { id:'freelance',name:'Freelance' },
    { id:'invest',   name:'Investimentos' },
    { id:'rent',     name:'Aluguel' },
    { id:'other-in', name:'Outros' },
  ],
  expense: [
    { id:'home',     name:'Moradia' },
    { id:'food',     name:'Alimentação' },
    { id:'transport',name:'Transporte' },
    { id:'health',   name:'Saúde' },
    { id:'education',name:'Educação' },
    { id:'subs',     name:'Assinaturas' },
    { id:'card',     name:'Cartão' },
    { id:'leisure',  name:'Lazer' },
    { id:'other-out',name:'Outros' },
  ]
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_DATA);
    const d = JSON.parse(raw);
    if(!d.items) d.items = [];
    if(!d.status) d.status = {};
    return d;
  }catch(e){
    console.error('load error',e);
    return structuredClone(DEFAULT_DATA);
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
}

/* ============================================================
   State
============================================================ */
const state = {
  data: loadData(),
  current: monthKey(new Date()),     // YYYY-MM
  modalOpen: false,
  editing: null,                      // item id
  formType: 'expense',
  formCategory: null,
};

function monthKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function shiftMonth(key, delta){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthKey(d);
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}

/* ============================================================
   Money helpers
============================================================ */
const fmtBRL = (v) => 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBRLshort = (v) => {
  v = v || 0;
  if(Math.abs(v) >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + 'k';
  return fmtBRL(v);
};

function parseAmountInput(s){
  if(!s) return 0;
  s = String(s).replace(/[^0-9,.-]/g,'');
  // accept "1.234,56" or "1234.56" or "1234,56"
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',','.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

/* ============================================================
   Computations
============================================================ */
function getStatus(monthKey, itemId){
  return state.data.status[monthKey]?.[itemId] || null;
}
function setStatus(monthKey, itemId, payload){
  if(!state.data.status[monthKey]) state.data.status[monthKey] = {};
  if(payload === null){
    delete state.data.status[monthKey][itemId];
    if(Object.keys(state.data.status[monthKey]).length === 0) delete state.data.status[monthKey];
  }else{
    state.data.status[monthKey][itemId] = payload;
  }
  saveData();
}

function isItemActiveInMonth(item, mKey){
  if(item.archived) return false;
  // active if createdMonth <= mKey
  const created = (item.createdAt||'').slice(0,7);
  if(created && created > mKey) return false;
  return true;
}

function monthSummary(mKey){
  const items = state.data.items.filter(i => isItemActiveInMonth(i, mKey));
  let income = 0, expense = 0, incomePaid = 0, expensePaid = 0, incomeCount=0, expenseCount=0, incomeDoneCount=0, expenseDoneCount=0;
  items.forEach(i=>{
    const paid = !!getStatus(mKey, i.id);
    if(i.type === 'income'){
      income += i.amount; incomeCount++;
      if(paid){ incomePaid += i.amount; incomeDoneCount++; }
    }else{
      expense += i.amount; expenseCount++;
      if(paid){ expensePaid += i.amount; expenseDoneCount++; }
    }
  });
  return {income, expense, incomePaid, expensePaid, balance: income-expense, balanceRealized: incomePaid-expensePaid, incomeCount, expenseCount, incomeDoneCount, expenseDoneCount};
}

/* ============================================================
   Render
============================================================ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function render(){
  renderMonth();
  renderSummary();
  renderLists();
}

function renderMonth(){
  $('#monthTitle').textContent = monthLabel(state.current);
  const isCurrent = state.current === monthKey(new Date());
  $('#goToday').classList.toggle('hidden', isCurrent);
}

function renderSummary(){
  const s = monthSummary(state.current);
  $('#sumIncome').textContent = fmtBRL(s.income);
  $('#sumExpense').textContent = fmtBRL(s.expense);
  $('#sumBalance').textContent = fmtBRL(s.balance);

  $('#subIncome').textContent = `${s.incomeDoneCount}/${s.incomeCount} recebidas · ${fmtBRLshort(s.incomePaid)}`;
  $('#subExpense').textContent = `${s.expenseDoneCount}/${s.expenseCount} pagas · ${fmtBRLshort(s.expensePaid)}`;
  $('#subBalance').textContent = `realizado ${fmtBRLshort(s.balanceRealized)}`;

  const balCell = $('.sum-cell.balance');
  balCell.classList.toggle('positive', s.balance >= 0);
  balCell.classList.toggle('negative', s.balance < 0);

  $('#incomeTotal').textContent = fmtBRL(s.income);
  $('#expenseTotal').textContent = fmtBRL(s.expense);

  const totalCount = s.incomeCount + s.expenseCount;
  const doneCount = s.incomeDoneCount + s.expenseDoneCount;
  if(totalCount > 0){
    const pct = Math.round((doneCount/totalCount)*100);
    $('#progressWrap').style.display = '';
    $('#progressLabel').textContent = `${doneCount} de ${totalCount} concluídos`;
    $('#progressPct').textContent = pct + '%';
    $('#progressFill').style.width = pct + '%';
  }else{
    $('#progressWrap').style.display = 'none';
  }
}

function todayInfo(mKey){
  const today = new Date();
  const tKey = monthKey(today);
  return { isCurrentMonth: tKey === mKey, day: today.getDate(), key: tKey };
}

function renderLists(){
  const t = todayInfo(state.current);
  ['income','expense'].forEach(type=>{
    const list = $('#'+type+'List');
    const items = state.data.items
      .filter(i => i.type === type && isItemActiveInMonth(i, state.current))
      .sort((a,b)=> a.dayOfMonth - b.dayOfMonth || a.name.localeCompare(b.name));

    if(items.length === 0){
      list.innerHTML = `<div class="empty">Nenhuma ${type==='income'?'receita':'despesa'} ainda</div>`;
      return;
    }

    list.innerHTML = items.map(i=>{
      const paid = !!getStatus(state.current, i.id);
      const overdue = !paid && t.isCurrentMonth && i.dayOfMonth < t.day;
      const cat = (CATEGORIES[type].find(c=>c.id===i.categoryId)||{}).name || '';
      const dayLabel = `dia ${i.dayOfMonth}`;
      return `
        <div class="item ${paid?'paid':''}" data-id="${i.id}">
          <button class="check" data-action="toggle" aria-label="Marcar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#06070b" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>
          </button>
          <div class="item-body" data-action="edit">
            <div class="item-name">${escapeHtml(i.name)}</div>
            <div class="item-meta">
              <span class="item-day ${overdue?'item-overdue':''}">${dayLabel}${overdue?' · atrasado':''}</span>
              ${cat ? `<span>·</span><span>${cat}</span>` : ''}
            </div>
          </div>
          <div class="item-amount">${fmtBRL(i.amount)}</div>
        </div>
      `;
    }).join('');
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   Modal
============================================================ */
function openModal(opts={}){
  state.modalOpen = true;
  state.editing = opts.editing || null;
  state.formType = opts.type || (state.editing ? state.data.items.find(i=>i.id===state.editing)?.type : 'expense');

  $('#modalTitle').textContent = state.editing ? 'Editar lançamento' : 'Novo lançamento';
  $('#btnDelete').style.display = state.editing ? '' : 'none';

  if(state.editing){
    const it = state.data.items.find(i=>i.id===state.editing);
    $('#fName').value = it.name;
    $('#fAmount').value = it.amount.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    $('#fDay').value = it.dayOfMonth;
    state.formCategory = it.categoryId;
  }else{
    $('#fName').value = '';
    $('#fAmount').value = '';
    $('#fDay').value = String(new Date().getDate());
    state.formCategory = null;
  }

  renderTypeToggle();
  renderCategories();
  $('#modalBg').classList.add('open');
  setTimeout(()=>$('#fName').focus(), 100);
}

function closeModal(){
  state.modalOpen = false;
  state.editing = null;
  $('#modalBg').classList.remove('open');
}

function renderTypeToggle(){
  $('#typeIncome').classList.toggle('active', state.formType==='income');
  $('#typeExpense').classList.toggle('active', state.formType==='expense');
}

function renderCategories(){
  const cats = CATEGORIES[state.formType];
  if(!state.formCategory || !cats.find(c=>c.id===state.formCategory)){
    state.formCategory = cats[0].id;
  }
  $('#catList').innerHTML = cats.map(c=>
    `<button class="cat-chip ${c.id===state.formCategory?'active':''}" data-cat="${c.id}">${c.name}</button>`
  ).join('');
}

function renderDays(){
  const sel = $('#fDay');
  let html = '';
  for(let i=1;i<=31;i++) html += `<option value="${i}">${i}</option>`;
  sel.innerHTML = html;
}

function saveItem(){
  const name = $('#fName').value.trim();
  const amount = parseAmountInput($('#fAmount').value);
  const dayOfMonth = parseInt($('#fDay').value, 10);
  if(!name){ toast('Coloque uma descrição'); $('#fName').focus(); return; }
  if(amount <= 0){ toast('Coloque um valor maior que zero'); $('#fAmount').focus(); return; }

  if(state.editing){
    const it = state.data.items.find(i=>i.id===state.editing);
    it.type = state.formType;
    it.name = name;
    it.amount = amount;
    it.dayOfMonth = dayOfMonth;
    it.categoryId = state.formCategory;
    toast('Atualizado');
  }else{
    state.data.items.push({
      id: Math.random().toString(36).slice(2,11),
      type: state.formType,
      name, amount, dayOfMonth,
      categoryId: state.formCategory,
      createdAt: new Date().toISOString(),
    });
    toast(state.formType==='income' ? 'Receita adicionada' : 'Despesa adicionada');
  }
  saveData();
  render();
  closeModal();
}

function deleteItem(){
  if(!state.editing) return;
  if(!confirm('Excluir este lançamento? Isso remove de todos os meses.')) return;
  state.data.items = state.data.items.filter(i=>i.id !== state.editing);
  // also clean status
  Object.keys(state.data.status).forEach(mk=>{
    if(state.data.status[mk][state.editing]) delete state.data.status[mk][state.editing];
    if(Object.keys(state.data.status[mk]).length===0) delete state.data.status[mk];
  });
  saveData();
  render();
  closeModal();
  toast('Removido');
}

/* ============================================================
   Toast
============================================================ */
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============================================================
   Export / Import / Reset
============================================================ */
function doExport(){
  const blob = new Blob([JSON.stringify(state.data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `financas-${monthKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Exportado');
}
function doImport(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!d || !Array.isArray(d.items)) throw new Error('inválido');
      if(!confirm('Substituir todos os dados pelos do arquivo?')) return;
      state.data = { version:1, items:d.items, status:d.status||{} };
      saveData();
      render();
      toast('Importado');
    }catch(err){ alert('Arquivo inválido'); }
  };
  reader.readAsText(file);
}
function doReset(){
  if(!confirm('Apagar TODOS os lançamentos e histórico? Não pode desfazer.')) return;
  state.data = structuredClone(DEFAULT_DATA);
  saveData();
  render();
  toast('Tudo limpo');
}

/* ============================================================
   Wire-up
============================================================ */
function bind(){
  // month nav
  $('#prevMonth').onclick = ()=>{ state.current = shiftMonth(state.current,-1); render(); };
  $('#nextMonth').onclick = ()=>{ state.current = shiftMonth(state.current, 1); render(); };
  $('#goToday').onclick   = ()=>{ state.current = monthKey(new Date()); render(); };

  // fab + add buttons
  $('#fab').onclick = ()=> openModal({type: state.formType || 'expense'});
  $$('[data-add]').forEach(b=> b.onclick = ()=> openModal({type: b.dataset.add}));

  // modal
  $('#modalClose').onclick = closeModal;
  $('#btnCancel').onclick  = closeModal;
  $('#modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
  $('#typeIncome').onclick = ()=>{ state.formType='income'; state.formCategory=null; renderTypeToggle(); renderCategories(); };
  $('#typeExpense').onclick= ()=>{ state.formType='expense'; state.formCategory=null; renderTypeToggle(); renderCategories(); };
  $('#catList').onclick = (e)=>{
    const b = e.target.closest('[data-cat]'); if(!b) return;
    state.formCategory = b.dataset.cat; renderCategories();
  };
  $('#btnSave').onclick = saveItem;
  $('#btnDelete').onclick = deleteItem;

  // amount mask
  $('#fAmount').addEventListener('blur', e=>{
    const n = parseAmountInput(e.target.value);
    e.target.value = n ? n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
  });

  // list interactions (delegated)
  document.addEventListener('click', e=>{
    const item = e.target.closest('.item');
    if(!item) return;
    const action = e.target.closest('[data-action]')?.dataset.action;
    const id = item.dataset.id;
    if(action === 'toggle'){
      const cur = getStatus(state.current, id);
      setStatus(state.current, id, cur ? null : { paid:true, paidAt:new Date().toISOString() });
      render();
    } else if(action === 'edit'){
      openModal({editing:id});
    }
  });

  // menu
  const menuBtn = $('#btnMenu'), menu = $('#menu');
  menuBtn.onclick = (e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('click', e=>{
    if(!menu.contains(e.target) && !menuBtn.contains(e.target)) menu.classList.remove('open');
  });
  $('#mExport').onclick = ()=>{ doExport(); menu.classList.remove('open'); };
  $('#mImport').onclick = ()=>{ $('#fileImport').click(); menu.classList.remove('open'); };
  $('#mReset').onclick  = ()=>{ doReset(); menu.classList.remove('open'); };
  $('#fileImport').onchange = e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };

  // keyboard
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && state.modalOpen) closeModal();
    if(e.key === 'Enter' && state.modalOpen && document.activeElement.tagName !== 'BUTTON'){
      saveItem();
    }
  });
}

/* ============================================================
   First run: seed nothing, just an empty state
============================================================ */
renderDays();
bind();
render();
</script>
</body>
</html>
